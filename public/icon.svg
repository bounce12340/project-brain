<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#13244A"/>
      <stop offset="1" stop-color="#070B14"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C878"/>
      <stop offset="1" stop-color="#8A7133"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#35C8FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#35C8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BE6FF"/>
      <stop offset="1" stop-color="#35C8FF"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AD4FF"/>
      <stop offset="1" stop-color="#2493D1"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A86C4"/>
      <stop offset="1" stop-color="#123F66"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#frame)" stroke-width="10"/>

  <ellipse cx="256" cy="262" rx="170" ry="190" fill="url(#glow)"/>

  <!-- 水晶：左、中、右三個切面 -->
  <polygon points="256,78 170,188 170,326 256,436" fill="url(#left)"/>
  <polygon points="256,78 226,188 226,326 256,436 286,326 286,188" fill="url(#mid)"/>
  <polygon points="256,78 342,188 342,326 256,436" fill="url(#right)"/>
  <polygon points="256,78 286,188 286,326 256,436" fill="url(#right)" opacity=".55"/>
  <!-- 上方斜切面的亮邊 -->
  <polygon points="256,78 170,188 226,188" fill="#E6F8FF" opacity=".75"/>
  <polygon points="256,78 226,188 286,188" fill="#BDEEFF" opacity=".55"/>
  <polyline points="170,188 342,188" stroke="#E6F8FF" stroke-opacity=".5" stroke-width="3" fill="none"/>
  <polyline points="170,326 342,326" stroke="#0B2A45" stroke-opacity=".45" stroke-width="3" fill="none"/>
  <polygon points="256,78 342,188 342,326 256,436 170,326 170,188" fill="none" stroke="#E8C878" stroke-width="7" stroke-linejoin="round"/>

  <!-- 星光 -->
  <path d="M378 118 L386 140 L408 148 L386 156 L378 178 L370 156 L348 148 L370 140 Z" fill="#E8C878"/>
</svg>
